[package]
name = "needle-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true

# Needle's core for the phone apps: a library the Android app loads, with Kotlin bindings made
# by UniFFI (`cargo run -p needle-mobile --bin uniffi-bindgen`).
[lib]
name = "needle_mobile"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
anyhow = "1"
# No stems: ONNX Runtime has no prebuilt library for Android.
needle-core = { path = "../needle-core", default-features = false }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
uniffi = { version = "0.32", features = ["cli"] }

[target.'cfg(target_os = "android")'.dependencies]
# The audio output (cpal) asks Android for its devices through the app's Java context.
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
tempfile = "3"
