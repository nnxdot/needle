[package]
name = "needle"
default-run = "needle-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
needle-core = { path = "../needle-core" }
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
rand = "0.8"
raw-window-handle = "0.6"
rfd = "0.15"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14.1", default-features = false }

[[bin]]
name = "needle"
path = "src/main.rs"

[[bin]]
name = "needle-desktop"
path = "src/desktop.rs"

[target.'cfg(windows)'.dependencies]
souvlaki = "0.8"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3"
