<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171615">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Needle</title>
<style>
:root {
  --chrome: #171615; --canvas: #201e1d; --raised: #2b2927; --line: #3a3634;
  --ink: #efedeb; --ink-2: #bdb8b3; --ink-3: #a19b95;
  --amber: #e2b46c; --amber-ink: #231a0c; --amber-soft: rgb(226 180 108 / .14);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--chrome); color: var(--ink); }
body {
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
main { max-width: 480px; margin: 0 auto; padding: 16px 20px 32px; }
header { display: flex; align-items: center; gap: 10px; padding: 4px 0 16px; }
header svg { width: 28px; height: 28px; }
header b { font-size: 18px; }
header small { margin-left: auto; color: var(--ink-3); font-size: 13px; text-align: right; }
.cover {
  width: 100%; aspect-ratio: 1; border-radius: 14px; background: var(--raised) center / cover no-repeat;
  box-shadow: 0 20px 40px -20px rgb(0 0 0 / .8); display: grid; place-items: center;
}
.cover svg { width: 40%; opacity: .5; }
.cover.has svg { display: none; }
h1 { font-size: 22px; margin: 18px 0 2px; overflow-wrap: anywhere; }
.artist { color: var(--ink-2); margin: 0; overflow-wrap: anywhere; }
.bar { margin: 20px 0 4px; height: 28px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
.track { position: relative; width: 100%; height: 5px; border-radius: 3px; background: var(--raised); }
.fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: var(--amber); }
.times { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
.controls { display: flex; justify-content: center; align-items: center; gap: 28px; margin: 18px 0 10px; }
button {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
}
.controls button { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; }
.controls button:active { background: var(--raised); }
.controls svg { width: 30px; height: 30px; fill: var(--ink); }
.controls .play { width: 76px; height: 76px; background: var(--amber); }
.controls .play svg { fill: var(--amber-ink); width: 34px; height: 34px; }
.volume { display: flex; align-items: center; gap: 12px; margin: 8px 0 24px; color: var(--ink-3); }
input[type=range] { flex: 1; accent-color: var(--amber); height: 28px; }
nav { display: flex; gap: 8px; margin-bottom: 12px; }
nav button { flex: 1; padding: 10px; border-radius: 999px; background: var(--raised); color: var(--ink-2); font-weight: 600; font-size: 14px; }
nav button.on { background: var(--amber-soft); color: var(--amber); }
.search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--canvas); color: var(--ink); font: inherit; margin-bottom: 8px; }
ol { list-style: none; margin: 0; padding: 0; }
li { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
li .text { flex: 1; min-width: 0; }
li .text b, li .text span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
li .text b { font-weight: 600; font-size: 15px; }
li .text span { color: var(--ink-3); font-size: 13px; }
li button { color: var(--amber); font-size: 13px; font-weight: 600; padding: 8px 10px; border-radius: 8px; background: var(--amber-soft); }
.empty { color: var(--ink-3); padding: 16px 4px; }
.offline { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--raised); color: var(--ink-2); padding: 10px 16px; border-radius: 999px; font-size: 14px; display: none; }
.offline.show { display: block; }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="45" cy="56" r="31" fill="#e1b36b"/>
      <g fill="none" stroke="#c6944e" stroke-width="1.7"><circle cx="45" cy="56" r="26.5"/><circle cx="45" cy="56" r="22.3"/><circle cx="45" cy="56" r="18.1"/></g>
      <circle cx="45" cy="56" r="10.2" fill="#1b1816"/><circle cx="45" cy="56" r="2.6" fill="#e1b36b"/>
      <path d="M61.5 41 81.5 17.5" stroke="#efe6d8" stroke-width="5.6" stroke-linecap="round"/>
      <circle cx="82" cy="17" r="6.8" fill="#efe6d8"/><circle cx="82" cy="17" r="2.6" fill="#1b1816"/>
    </svg>
    <b>Needle</b>
    <small id="output"></small>
  </header>

  <div class="cover" id="cover" role="img" aria-label="Album cover">
    <svg viewBox="0 0 24 24" fill="none" stroke="#a19b95" stroke-width="1.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>
  </div>
  <h1 id="title">Nothing playing</h1>
  <p class="artist" id="artist">Choose a song below, or on the computer.</p>

  <div class="bar" id="bar" role="slider" aria-label="Position" tabindex="0" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00 of 0:00"><div class="track"><div class="fill" id="fill"></div></div></div>
  <div class="times"><span id="now">0:00</span><span id="length">0:00</span></div>

  <div class="controls">
    <button id="previous" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button id="toggle" class="play" aria-label="Play"><svg viewBox="0 0 24 24" id="toggle-icon"><path d="M7 4v16l13-8z"/></svg></button>
    <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>

  <label class="volume"><span aria-hidden="true">🔈</span><input type="range" id="volume" min="0" max="1" step="0.01" aria-label="Volume"><span aria-hidden="true">🔊</span></label>

  <nav>
    <button id="tab-queue" class="on">Up next</button>
    <button id="tab-search">Find music</button>
  </nav>
  <section id="queue-pane"><ol id="queue"></ol></section>
  <section id="search-pane" hidden>
    <input class="search" id="search" type="search" placeholder="Search, or write a rule like rating >= 4" autocomplete="off">
    <ol id="results"></ol>
  </section>
</main>
<div class="offline" id="offline">Can't reach Needle. Is it still open?</div>

<script>
const base = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
const $ = id => document.getElementById(id);
let state = null, dragging = false, volumeBusy = 0, lastCover = null;

function time(s) {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
}
async function send(action, body) {
  try {
    await fetch(base + 'api/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  } catch (e) { $('offline').classList.add('show'); }
  setTimeout(refresh, 150);
}
function row(title, artist, label, onClick) {
  const li = document.createElement('li');
  const text = document.createElement('div');
  text.className = 'text';
  const b = document.createElement('b'); b.textContent = title;
  const span = document.createElement('span'); span.textContent = artist;
  text.append(b, span);
  li.append(text);
  if (label) {
    const button = document.createElement('button');
    button.textContent = label;
    button.onclick = onClick;
    li.append(button);
  }
  return li;
}
function draw() {
  const s = state, c = s.current;
  $('output').textContent = s.output ? 'On ' + s.output : '';
  $('title').textContent = c ? c.title : 'Nothing playing';
  $('artist').textContent = c ? [c.artist, c.album].filter(Boolean).join(' · ') : 'Choose a song below, or on the computer.';
  document.title = c ? `${c.title} · Needle` : 'Needle';
  const cover = c && c.cover ? base + 'api/cover/' + encodeURIComponent(c.id) : null;
  if (cover !== lastCover) {
    lastCover = cover;
    $('cover').style.backgroundImage = cover ? `url("${cover}")` : '';
    $('cover').classList.toggle('has', !!cover);
  }
  const length = c ? c.duration : 0;
  if (!dragging) {
    $('fill').style.width = length ? Math.min(100, s.position / length * 100) + '%' : '0';
    $('now').textContent = time(s.position);
    setSlider(s.position, length);
  }
  $('length').textContent = time(length);
  $('toggle').setAttribute('aria-label', s.playing ? 'Pause' : 'Play');
  $('toggle-icon').innerHTML = s.playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>';
  if (Date.now() - volumeBusy > 1500) $('volume').value = s.volume;
  const list = $('queue');
  list.replaceChildren(...s.queue.map(q => row(q.title, q.artist, 'Play', () => send('jump', { index: q.index, id: q.id }))));
  if (!s.queue.length) {
    const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'Nothing is up next.';
    list.append(li);
  }
}
function setSlider(position, length) {
  const bar = $('bar');
  bar.setAttribute('aria-valuemax', String(Math.floor(length)));
  bar.setAttribute('aria-valuenow', String(Math.floor(Math.min(position, length))));
  bar.setAttribute('aria-valuetext', `${time(position)} of ${time(length)}`);
}
// Only the newest answer counts: an older one arriving late must not undo a newer one.
let refreshes = 0;
async function refresh() {
  const request = ++refreshes;
  try {
    const response = await fetch(base + 'api/state', { cache: 'no-store' });
    if (!response.ok) throw new Error();
    const next = await response.json();
    if (request !== refreshes) return;
    state = next;
    $('offline').classList.remove('show');
    draw();
  } catch (e) { if (request === refreshes) $('offline').classList.add('show'); }
}
$('toggle').onclick = () => send('toggle');
$('next').onclick = () => send('next');
$('previous').onclick = () => send('previous');

// Volume: one change on its way at a time, and the last value always sent last.
let volumeWanted = null, volumeSending = false;
async function sendVolume() {
  if (volumeSending || volumeWanted === null) return;
  volumeSending = true;
  const value = volumeWanted;
  volumeWanted = null;
  try {
    await fetch(base + 'api/volume', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ value }) });
  } catch (e) { $('offline').classList.add('show'); }
  volumeSending = false;
  if (volumeWanted !== null) sendVolume();
}
$('volume').oninput = e => {
  volumeBusy = Date.now();
  volumeWanted = Number(e.target.value);
  sendVolume();
};

function seekTo(event, commit) {
  if (!state || !state.current) return;
  const rect = $('bar').getBoundingClientRect();
  const x = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
  const seconds = x * state.current.duration;
  $('fill').style.width = x * 100 + '%';
  $('now').textContent = time(seconds);
  setSlider(seconds, state.current.duration);
  if (commit) send('seek', { seconds });
}
$('bar').addEventListener('pointerdown', e => { dragging = true; $('bar').setPointerCapture(e.pointerId); seekTo(e, false); });
$('bar').addEventListener('pointermove', e => { if (dragging) seekTo(e, false); });
$('bar').addEventListener('pointerup', e => { if (dragging) { dragging = false; seekTo(e, true); } });
// A cancelled touch (a scroll, a call) ends the drag without seeking.
$('bar').addEventListener('pointercancel', () => { dragging = false; if (state) draw(); });
// Keys: arrows move 5 seconds (Page Up/Down 30), Home and End go to the start and end.
$('bar').addEventListener('keydown', e => {
  if (!state || !state.current) return;
  const length = state.current.duration;
  const steps = { ArrowLeft: -5, ArrowDown: -5, ArrowRight: 5, ArrowUp: 5, PageDown: -30, PageUp: 30 };
  let seconds;
  if (e.key in steps) seconds = state.position + steps[e.key];
  else if (e.key === 'Home') seconds = 0;
  else if (e.key === 'End') seconds = Math.max(0, length - 1);
  else return;
  e.preventDefault();
  seconds = Math.min(Math.max(0, seconds), length);
  state.position = seconds;
  draw();
  send('seek', { seconds });
});

function tab(which) {
  $('tab-queue').classList.toggle('on', which === 'queue');
  $('tab-search').classList.toggle('on', which === 'search');
  $('queue-pane').hidden = which !== 'queue';
  $('search-pane').hidden = which !== 'search';
  if (which === 'search') $('search').focus();
}
$('tab-queue').onclick = () => tab('queue');
$('tab-search').onclick = () => tab('search');

let searchTimer = 0, searchVersion = 0;
$('search').oninput = () => {
  clearTimeout(searchTimer);
  const version = ++searchVersion;
  searchTimer = setTimeout(async () => {
    const q = $('search').value.trim();
    const list = $('results');
    if (!q) { list.replaceChildren(); return; }
    try {
      const found = await (await fetch(base + 'api/search?q=' + encodeURIComponent(q))).json();
      // Results for an older search arrive too late to show.
      if (version !== searchVersion) return;
      list.replaceChildren(...found.map(t => row(t.title, [t.artist, t.album].filter(Boolean).join(' · '), 'Play', () => send('play', { ids: [t.id] }))));
      if (!found.length) {
        const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'No songs found.';
        list.append(li);
      }
    } catch (e) { if (version === searchVersion) $('offline').classList.add('show'); }
  }, 250);
};

refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
