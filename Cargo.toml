[workspace]
members = ["crates/needle-core", "crates/needle"]
resolver = "2"

[workspace.package]
version = "1.4.3"
edition = "2024"
license = "LicenseRef-Proprietary"

[profile.dev]
debug = 0

# Unoptimized Opus decoding is too slow for real-time playback in dev builds.
[profile.dev.package.opus-decoder]
opt-level = 3

# The same for WebAssembly effects, which run on the audio thread.
[profile.dev.package.wasmi]
opt-level = 3
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
[profile.dev.package.wasmi_collections]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"

# Pure-Rust Opus decoder with a faster MDCT FFT; see THIRD-PARTY-NOTICES.md.
[patch.crates-io]
opus-decoder = { path = "third-party/patched/opus-decoder-0.1.1" }
# Blends soft edges correctly on see-through (glass) windows; see third-party/patched/gpui-0.2.2.
gpui = { path = "third-party/patched/gpui-0.2.2" }
